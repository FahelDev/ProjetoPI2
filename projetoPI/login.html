<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Farma7</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #cbdae6;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      width: 380px;
      text-align: center;
      animation: fadeIn 0.6s ease-in-out;
    }

    .container h2 {
      color: #ff0000;
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      text-align: left;
      font-weight: 600;
      font-size: 0.95rem;
      color: #333;
    }

    input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #78dfff;
    }

    button {
      margin-top: 10px;
      padding: 12px;
      background: #78dfff;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: 0.3s;
    }

    button:hover {
      background: #ff0000;
    }

    .link {
      margin-top: 20px;
      font-size: 0.95rem;
    }

    .link a {
      color: #78dfff;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
    }

    .link a:hover {
      color: #ff0000;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(15px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Entrar na Farma7</h2>
<form onsubmit="event.preventDefault(); window.location.href='index.html';">
  <label for="email">E-mail</label>
  <input type="email" id="email" placeholder="Digite seu e-mail" required>
  
  <label for="senha">Senha</label>
  <input type="password" id="senha" placeholder="Digite sua senha" required>
  
  <button type="submit">Entrar</button>
</form>

    <div class="link">
      <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
      <p>Administrador? <a href="adm.html">Entrar como administrador</a></p>
    </div>
  </div>

  
</body>
</html>
