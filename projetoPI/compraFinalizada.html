<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parabéns</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #cbdae6;
      color: #333;
    }

    .container {
      text-align: center;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 90%;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #ff0000;
    }

    .emoji {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 20px;
      color: #555;
    }

    a.button {
      display: inline-block;
      background: #78dfff;
  color: #fff;
  border: none;
  padding: 12px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
    }

    a.button:hover {
      background: #ff0000;
    }


    
  </style>
</head>
<body>
  <div class="container">
    <h1>💊 Parabéns, sua compra foi realizada!</h1>
    <p>Você receberá um e-mail de confirmação com os detalhes do pedido.</p>
    <a href="index.html" class="button">Voltar à Loja</a>
  </div>
</body>
</html>
