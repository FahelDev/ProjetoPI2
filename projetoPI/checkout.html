<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Farma7</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html"> <img src="imgs/logoFarma (1).png" alt="logo da Farma7"> </a>
    
    <nav>
      <ul>
        <li><a href="carrinho.html">Voltar para Carrinho</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="checkout">
      <h2>Finalizar Compra</h2>
      
      <!-- Resumo do Carrinho -->
      <div class="resumo-carrinho">
        <h3>Resumo do Pedido</h3>
        <ul id="lista-resumo"></ul>
        <p>Total: R$ <span id="total-resumo">0.00</span></p>
      </div>

      <!-- Formulário de Endereço -->
      <div class="endereco">
        <h3>Endereço de Entrega</h3>
        <form id="form-endereco">
          <input type="text" id="nome" placeholder="Nome Completo" required>
          <input type="email" id="email" placeholder="E-mail" required>
          <input type="tel" id="telefone" placeholder="Telefone" required>
          <input type="text" id="cep" placeholder="CEP" required>
          <input type="text" id="endereco" placeholder="Endereço" required>
          <input type="text" id="numero" placeholder="Número" required>
          <input type="text" id="complemento" placeholder="Complemento (opcional)">
          <input type="text" id="bairro" placeholder="Bairro" required>
          <input type="text" id="cidade" placeholder="Cidade" required>
          <input type="text" id="estado" placeholder="Estado" required>
        </form>
      </div>

      <!-- Opções de Pagamento -->
      <div class="pagamento">
        <h3>Forma de Pagamento</h3>
        <div class="opcoes-pagamento">
          <label>
            <input type="radio" name="pagamento" value="pix" checked>
            PIX (Cópia da chave: chave.pix@farma7.com)
          </label>
          <label>
            <input type="radio" name="pagamento" value="cartao">
            Cartão de Crédito
          </label>
        </div>

        <!-- Campos para Cartão de Crédito (ocultos inicialmente) -->
        <div id="campos-cartao" style="display: none;">
          <input type="text" id="numero-cartao" placeholder="Número do Cartão" maxlength="19">
          <input type="text" id="validade" placeholder="Validade (MM/AA)" maxlength="5">
          <input type="text" id="cvv" placeholder="CVV" maxlength="3">
          <input type="text" id="nome-cartao" placeholder="Nome no Cartão">
        </div>
      </div>

      <button id="btn-finalizar-checkout" class="btn-finalizar" onclick="direcionarCompraFinalizada()">Finalizar Compra</button>


    </section>
  </main>

  <footer>
    <p>&copy; 2025 Farma7. Todos os direitos reservados.</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
