tela de manuntenção :

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Manutenção de Produtos - Administrador</title>
<body>
  <div class="container">
    <h1>Manutenção de Produtos</h1>
    <table id="productTable">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Preço</th>
          <th>Descrição</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Dipirona</td>
          <td>R$ 10,00</td>
          <td>Analgésico e antitérmico</td>
          <td>
            <button onclick="editProduct(this)">Editar</button>
            <button onclick="deleteProduct(this)">Excluir</button>
          </td>
        </tr>
      </tbody>
    </table>


    <div class="form-section">
      <h2>Adicionar Novo Produto</h2>
      <input type="text" id="productName" placeholder="Nome do Produto">
      <input type="number" id="productPrice" placeholder="Preço (R$)">
      <textarea id="productDesc" placeholder="Descrição"></textarea>
      <button onclick="addProduct()">Adicionar Produto</button>
    </div>
  </div>

  <script>
    function addProduct() {
      let name = document.getElementById("productName").value;
      let price = document.getElementById("productPrice").value;
      let desc = document.getElementById("productDesc").value;

      if(name && price && desc) {
        let table = document.getElementById("productTable").getElementsByTagName("tbody")[0];
        let newRow = table.insertRow();

        newRow.innerHTML = `
          <td>${name}</td>
          <td>R$ ${parseFloat(price).toFixed(2)}</td>
          <td>${desc}</td>
          <td>
            <button onclick="editProduct(this)">Editar</button>
            <button onclick="deleteProduct(this)">Excluir</button>
          </td>
        `;

        document.getElementById("productName").value = "";
        document.getElementById("productPrice").value = "";
        document.getElementById("productDesc").value = "";
      } else {
        alert("Preencha todos os campos!");
      }
    }

    function deleteProduct(button) {
      let row = button.parentNode.parentNode;
      row.parentNode.removeChild(row);
    }

    function editProduct(button) {
      let row = button.parentNode.parentNode;
      let cells = row.getElementsByTagName("td");

      document.getElementById("productName").value = cells[0].innerText;
      document.getElementById("productPrice").value = cells[1].innerText.replace("R$ ", "").replace(",", ".");
      document.getElementById("productDesc").value = cells[2].innerText;

      row.parentNode.removeChild(row);
    }
  </script>
</body>
</html>
