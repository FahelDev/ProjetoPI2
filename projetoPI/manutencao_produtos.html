<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Manutenção de Produtos | Farma7 </title>
  <link rel="stylesheet" href="style.css">

<style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #cbdae6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 150vh;
    }

    .container {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      
      animation: fadeIn 0.6s ease-in-out;
    }

    .container h2 {
      color: #ff0000;
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    .manutencao{

      display: grid;
      padding: 25px;

    }

    .addProduto{

      display: grid;
      align-items: center;


    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      text-align: left;
      font-weight: 600;
      font-size: 0.95rem;
      color: #333;
    }

    input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #78dfff;
    }

    button {
      margin-top: 10px;
      padding: 12px;
      background: #78dfff;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: 0.3s;
    }

    button:hover {
      background: #ff0000;
    }
    
    a{

      color: #ff0000;

    }


    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(15px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>

</head>
<body>

<div class="container">

<h1>Farma7 - Painel de Administração</h1>

<main>
  <div class="addProduto">
    <h2>Adicionar / Editar Produto</h2>
    Nome: <input type="text" id="nome"><br>
    Preço: <input type="number" id="preco"><br>
    Quantidade: <input type="number" id="quantidade"><br>
    <button onclick="salvarProduto()">Salvar Produto</button>
    <input type="hidden" id="indiceEditar">
  </div>

  <div class="manutencao">
    <br>
    <h2>Pesquisar Produto</h2>
    <input type="text" id="pesquisa" onkeyup="pesquisarProduto()" placeholder="Digite o nome do produto...">


  <div style="flex-basis: 100%;">
    <br>
    <br>
    <h2>Lista de Produtos</h2>
    <table id="tabela">
      <tr>
        <th>Nome</th>
        <th>Preço</th>
        <th>Quantidade</th>
        <th>Ações</th>
      </tr>
    </table>
  </div>
  </div>

<p><a href="index.html">Sair</a></p>

</main>
</div>

<script>

  var produtos = [];

  function salvarProduto() {
    var nome = document.getElementById("nome").value;
    var preco = document.getElementById("preco").value;
    var quantidade = document.getElementById("quantidade").value;
    var indice = document.getElementById("indiceEditar").value;

    if (nome === "" || preco === "" || quantidade === "") {
      alert("Preencha todos os campos!");
      return;
    }

    if (indice === "") {
      produtos.push({nome: nome, preco: preco, quantidade: quantidade});
    } else {
      produtos[indice] = {nome: nome, preco: preco, quantidade: quantidade};
      document.getElementById("indiceEditar").value = "";
    }

    atualizarTabela();
    limparCampos();
  }

  function atualizarTabela() {
    var tabela = document.getElementById("tabela");
    tabela.innerHTML = "<tr><th>Nome</th><th>Preço</th><th>Quantidade</th><th>Ações</th></tr>";

    for (var i = 0; i < produtos.length; i++) {
      tabela.innerHTML += "<tr>" +
        "<td>" + produtos[i].nome + "</td>" +
        "<td>" + produtos[i].preco + "</td>" +
        "<td>" + produtos[i].quantidade + "</td>" +
        "<td>" +
        "<button onclick='editarProduto(" + i + ")'>Editar</button> " +
        "<button onclick='excluirProduto(" + i + ")'>Excluir</button>" +
        "</td></tr>";
    }
  }

  function editarProduto(i) {
    document.getElementById("nome").value = produtos[i].nome;
    document.getElementById("preco").value = produtos[i].preco;
    document.getElementById("quantidade").value = produtos[i].quantidade;
    document.getElementById("indiceEditar").value = i;
  }

  function excluirProduto(i) {
    produtos.splice(i, 1);
    atualizarTabela();
  }

  function pesquisarProduto() {
    var termo = document.getElementById("pesquisa").value.toLowerCase();
    var tabela = document.getElementById("tabela");
    for (var i = 1; i < tabela.rows.length; i++) {
      var nome = tabela.rows[i].cells[0].innerText.toLowerCase();
      tabela.rows[i].style.display = nome.indexOf(termo) > -1 ? "" : "none";
    }
  }

  function limparCampos() {
    document.getElementById("nome").value = "";
    document.getElementById("preco").value = "";
    document.getElementById("quantidade").value = "";
  }

</script>

</body>
</html>
